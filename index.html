<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuaShield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #07080a;
    --surface:   #0e1015;
    --surface2:  #13161c;
    --border:    #1e2330;
    --accent:    #5dffb4;
    --accent2:   #00c97a;
    --text:      #d4dce8;
    --muted:     #4a5568;
    --danger:    #ff4d6d;
    --mono: 'Space Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ── grid bg ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(93,255,180,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(93,255,180,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── intro ── */
  #intro {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: introOut 0.6s ease 2.6s forwards;
  }

  .intro-logo {
    font-family: var(--display);
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 800;
    letter-spacing: -2px;
    color: #fff;
    animation: logoIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s both;
  }
  .intro-logo span { color: var(--accent); }

  .intro-bar {
    margin-top: 32px;
    width: 200px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    animation: logoIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s both;
  }
  .intro-bar-fill {
    height: 100%;
    background: var(--accent);
    animation: barFill 2s ease 0.7s forwards;
    width: 0;
  }

  .intro-sub {
    margin-top: 14px;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: logoIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.7s both;
  }

  @keyframes logoIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
  @keyframes barFill { to { width: 100%; } }
  @keyframes introOut { to { opacity:0; pointer-events:none; } }

  /* ── layout ── */
  .shell {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 1080px;
    width: 92%;
    margin: 0 auto;
    padding: 48px 0 80px;
    opacity: 0;
    animation: fadeUp 0.7s ease 3s forwards;
  }
  @keyframes fadeUp { to { opacity:1; } }

  /* ── header ── */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 48px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo-text {
    font-family: var(--display);
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -1px;
    color: #fff;
    line-height: 1;
  }
  .logo-text span { color: var(--accent); }

  .badge-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 0.65rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.active {
    border-color: var(--accent2);
    color: var(--accent);
    background: rgba(93,255,180,0.06);
  }

  /* ── panels ── */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media(max-width:700px) { .panels { grid-template-columns: 1fr; } }

  .panel {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .panel-title {
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .panel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
  }
  .panel-dot.green { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }

  textarea, #output {
    flex: 1;
    min-height: 320px;
    padding: 20px;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.7;
    background: transparent;
    border: none;
    color: var(--text);
    resize: none;
    outline: none;
  }

  textarea::placeholder { color: var(--muted); }

  #output {
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--accent);
    overflow: auto;
    transition: opacity 0.2s;
  }
  #output.dim { opacity: 0.3; }

  /* ── action bar ── */
  .action-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 28px;
    border: none;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: #07080a;
  }
  .btn-primary:hover {
    background: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(93,255,180,0.25);
  }
  .btn-primary:active { transform: none; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  .btn-download {
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--accent2);
  }
  .btn-download:hover {
    background: rgba(93,255,180,0.08);
    transform: translateY(-2px);
  }
  .btn-download:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  /* spinner */
  .spin {
    display: none;
    width: 16px; height: 16px;
    border: 2px solid #07080a;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── footer ── */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-size: 0.65rem;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
  }
  footer a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>

<!-- intro -->
<div id="intro">
  <div class="intro-logo">Lua<span>Shield</span></div>
  <div class="intro-bar"><div class="intro-bar-fill"></div></div>
  <div class="intro-sub">Extreme Obfuscation Engine</div>
</div>

<!-- app -->
<div class="shell">

  <header>
    <div class="logo-text">Lua<span>Shield</span></div>
    <div class="badge-row">
      <div class="badge active">Extreme Protection</div>
      <div class="badge active">Anti-Reverse</div>
      <div class="badge active">Preserve Functionality</div>
    </div>
  </header>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Input — Lua Source</span>
        <div class="panel-dot"></div>
      </div>
      <textarea id="inputCode" placeholder="-- Paste your Lua code here...&#10;&#10;local function greet(name)&#10;  print('Hello, ' .. name)&#10;end&#10;greet('World')"></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Output — Obfuscated</span>
        <div class="panel-dot" id="outputDot"></div>
      </div>
      <div id="output"></div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-primary" id="obfBtn" onclick="obfuscateCode()">
      <div class="spin" id="spinner"></div>
      <span id="obfLabel">⚡ Obfuscate</span>
    </button>
    <button class="btn btn-ghost" onclick="clearFields()">Clear</button>
    <button class="btn btn-download" id="dlBtn" onclick="downloadOutput()" disabled>↓ Download .lua</button>
  </div>

</div>

<footer>
  Made by <a href="#">@vxpe_injected</a> on Discord &nbsp;·&nbsp; LuaShield v2.04.3
</footer>

<script>
// Always-on settings
const protectionLevel = 'extreme';
const antiReverseEngineering = 'extreme';
const preserveFunctionality = true;

function obfuscateCode() {
  const btn = document.getElementById('obfBtn');
  const spinner = document.getElementById('spinner');
  const label = document.getElementById('obfLabel');
  const out = document.getElementById('output');
  const dot = document.getElementById('outputDot');
  const dlBtn = document.getElementById('dlBtn');

  out.classList.add('dim');
  spinner.style.display = 'block';
  label.textContent = 'Working…';
  btn.disabled = true;
  dlBtn.disabled = true;
  dot.classList.remove('green');

  setTimeout(() => {
    const code = document.getElementById('inputCode').value || '';
    let result = applyObfuscation(code, protectionLevel, antiReverseEngineering);
    result = appendIdentifier(result);

    out.textContent = result;
    out.classList.remove('dim');
    spinner.style.display = 'none';
    label.textContent = '⚡ Obfuscate';
    btn.disabled = false;
    dot.classList.add('green');
    if (result.trim()) dlBtn.disabled = false;
  }, 400);
}

function clearFields() {
  document.getElementById('inputCode').value = '';
  document.getElementById('output').textContent = '';
  document.getElementById('outputDot').classList.remove('green');
  document.getElementById('dlBtn').disabled = true;
}

function downloadOutput() {
  const text = document.getElementById('output').textContent;
  if (!text.trim()) return;
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'obfuscated.lua';
  a.click();
  URL.revokeObjectURL(url);
}

// ── obfuscation engine ──

function applyObfuscation(code, level, antiReverse) {
  let obf = String(code || '');
  if (!obf.trim()) return obf;

  obf = removeBlockComments(obf);
  obf = removeLineComments(obf);
  obf = safeMinifyWhitespace(obf);

  const pipeline = [stringToCharCalls, advancedControlFlowObfuscation,
    (c) => deadCodeInsertion(c, preserveFunctionality), safeLocalRename,
    booleanObfuscation, simpleNumberObfuscation, dataObfuscation, safeFunctionInlining];

  for (const fn of pipeline) obf = fn(obf);

  const antiPipeline = [advancedControlFlowObfuscation, dataObfuscation,
    safeFunctionInlining, (c) => junkCodeInsertion(c, preserveFunctionality)];
  for (const fn of antiPipeline) obf = fn(obf);

  return obf;
}

function mapOutsideStrings(code, fn) {
  let out = ''; let i = 0; const len = code.length;
  while (i < len) {
    const ch = code[i];
    if (ch === '"' || ch === "'") {
      const quote = ch; out += ch; i++;
      while (i < len) {
        const cc = code[i]; out += cc; i++;
        if (cc === '\\') { if (i < len) { out += code[i]; i++; } continue; }
        if (cc === quote) break;
      }
    } else {
      let j = i;
      while (j < len && code[j] !== '"' && code[j] !== "'") j++;
      out += fn(code.slice(i, j)); i = j;
    }
  }
  return out;
}

function removeBlockComments(code) { return mapOutsideStrings(code, s => s.replace(/--\[\[[\s\S]*?\]\]/g, '')); }
function removeLineComments(code) { return mapOutsideStrings(code, s => s.replace(/--[^\n\r]*/g, '')); }

function safeMinifyWhitespace(code) {
  return mapOutsideStrings(code, outside => {
    let s = outside.replace(/\s+/g, ' ');
    s = s.replace(/\s*([=+\-*/%<>^(),;{}:\[\]])\s*/g, '$1');
    s = s.replace(/\blocal([A-Za-z_])/g, 'local $1');
    s = s.replace(/\bfunction([ (])/g, 'function $1');
    s = s.replace(/\bend([^\w])/g, 'end$1');
    return s.trim();
  });
}

function stringToCharCalls(code) {
  return mapOutsideStrings(code, outside =>
    outside.replace(/(["'])([^\1\\]{1,120}?)\1/g, (m, quote, inner) => {
      if (/[\\\r\n]/.test(inner)) return m;
      if (inner.length === 0) return quote + quote;
      return `string.char(${[...inner].map(ch => ch.charCodeAt(0)).join(',')})`;
    })
  );
}

function basicControlFlowObfuscation(code) {
  return mapOutsideStrings(code, outside => outside.replace(/;/g, '; if true then end'));
}

function advancedControlFlowObfuscation(code) {
  const a = genName(), b = genName();
  return `do local ${a}=0; local ${b}=1; if ${a}<${b} then ${a}=${a}+1; ${b}=${b}+1; end end\n` + code;
}

function deadCodeInsertion(code, preserve) {
  if (preserve) return code;
  const f = genName(), v = genName();
  return `local function ${f}() local ${v} = ${Math.floor(Math.random()*999)}; return ${v}; end\n` + code;
}

function junkCodeInsertion(code, preserve) {
  if (preserve) return code;
  const stmts = [`local ${genName()} = 1`, `local ${genName()} = string.char(72,101,108)`, `if (1==1) then end`];
  return stmts[Math.floor(Math.random()*stmts.length)] + '\n' + code;
}

function safeLocalRename(code) {
  const safe = new Set(['game','workspace','script','instance','Instance','require','task','wait','print','warn','tick','os','math','string','table','pairs','ipairs','next','type','error','pcall','xpcall','typeof']);
  let replacements = Object.create(null);
  const localDeclRegex = /\blocal\s+([a-zA-Z_]\w*)(?=\s*[=,;]|\s*$)/g;
  let m;
  while ((m = localDeclRegex.exec(code))) {
    const name = m[1];
    if (!safe.has(name) && !replacements[name]) replacements[name] = genName();
  }
  if (!Object.keys(replacements).length) return code;
  return mapOutsideStrings(code, chunk => {
    for (const orig in replacements) chunk = chunk.replace(new RegExp(`\\b${orig}\\b`, 'g'), replacements[orig]);
    return chunk;
  });
}

function safeFunctionInlining(code) {
  const declRegex = /local\s+function\s+([A-Za-z_]\w*)\s*\(\s*\)\s*([\s\S]*?)\s*end\b/g;
  const decls = []; let m;
  while ((m = declRegex.exec(code))) {
    const body = m[2].trim();
    const sr = body.match(/^\s*return\s+([\s\S]+?)\s*$/);
    if (sr) {
      const expr = sr[1].trim();
      if (!/[^0-9+\-*/().\s'"\[\],]/.test(expr) || /true|false|nil/.test(expr))
        decls.push({ name: m[1], expr, fullMatch: m[0] });
    }
  }
  if (!decls.length) return code;
  let out = mapOutsideStrings(code, chunk => {
    for (const d of decls) chunk = chunk.replace(new RegExp(`\\b${d.name}\\s*\\(\\s*\\)`, 'g'), `(${d.expr})`);
    return chunk;
  });
  for (const d of decls) out = out.replace(d.fullMatch, '');
  return out;
}

function booleanObfuscation(code) {
  return mapOutsideStrings(code, o => o.replace(/\btrue\b/g, '(1==1)').replace(/\bfalse\b/g, '(1==0)'));
}

function simpleNumberObfuscation(code) {
  return mapOutsideStrings(code, o => o.replace(/\b(\d+(\.\d+)?)\b/g, (m, n) => Math.random() < 0.35 ? `(${n} + 0)` : n));
}

function dataObfuscation(code) {
  return mapOutsideStrings(code, o => {
    const off = Math.floor(Math.random()*50)+1;
    return o.replace(/\b(\d+(\.\d+)?)\b/g, (m, n) => Math.random() < 0.25 ? `(${n}+${off}-${off})` : n);
  });
}

function appendIdentifier(code) {
  const id = generateId(64);
  return String(code||'') + '\n\n--[[ Identifier: ' + id + ' ]]';
}

function generateId(len=48) {
  const ch = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let o = '';
  for (let i=0; i<len; i++) o += ch.charAt(Math.floor(Math.random()*ch.length));
  return o;
}

function genName() {
  return `_vx${Math.floor(Math.random()*0xFFFFFF).toString(16)}${Math.floor(Math.random()*0xFFFFFF).toString(16)}`;
}
</script>
</body>
</html>
